name: v4 Terraform CI

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  quality:
    name: fmt, validate, test, and content
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform 1.15.8
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up terraform-docs 0.24.0
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) terraform_docs_arch="arm64" ;;
            x86_64) terraform_docs_arch="amd64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-darwin-${terraform_docs_arch}.tar.gz"
          curl --fail --location --silent --show-error "$url" --output "${RUNNER_TEMP}/terraform-docs.tar.gz"
          tar -xzf "${RUNNER_TEMP}/terraform-docs.tar.gz" -C "$RUNNER_TEMP" terraform-docs
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Check published content
        run: ./scripts/check-content.sh

      - name: Initialize and validate root, submodules, and examples
        shell: bash
        run: |
          set -euo pipefail
          for directory in . modules/* examples/*; do
            [[ -d "$directory" ]] || continue
            terraform -chdir="$directory" init -backend=false -lockfile=readonly
            terraform -chdir="$directory" validate -no-color
          done

      - name: Run complete Terraform-native suite
        run: terraform test -no-color
